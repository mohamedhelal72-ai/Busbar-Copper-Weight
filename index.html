<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copper Busbar Weight Calculator</title>
    <!-- Superhero theme (ttkbootstrap style) + minimal custom -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: #1a2639;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 2rem 1.5rem;
        }
        .card {
            background: #2b3a55;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .card-header {
            background: #3e4e6b;
            border-radius: 1rem 1rem 0 0 !important;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
            color: #d6e4ff;
            border-bottom: 1px solid #4b5d7c;
        }
        .btn-outline-info, .btn-outline-success, .btn-outline-danger {
            border-width: 2px;
            font-weight: 500;
        }
        .btn-outline-info:hover, .btn-outline-success:hover, .btn-outline-danger:hover {
            background: #3a4b6b;
            color: white;
        }
        .btn-group .btn {
            border-radius: 0.5rem;
            margin: 0 2px;
        }
        .table {
            color: #e8edf5;
            border-color: #3f5270;
        }
        .table thead th {
            background: #1f2d44;
            color: #bdd1f0;
            border-bottom: 2px solid #3f5270;
            font-weight: 600;
        }
        .table tbody tr {
            background: #263449;
            border-bottom: 1px solid #3a4a63;
        }
        .table tbody tr:hover {
            background: #2e3f5a;
        }
        .table tbody td {
            vertical-align: middle;
        }
        .total-weight {
            background: #1e2c44;
            border-radius: 2rem;
            padding: 0.75rem 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #b4e0b0;
            border: 1px solid #3f7a5a;
            display: inline-block;
        }
        .textarea-input {
            background: #1e2c40;
            color: #d0e0f0;
            border: 1px solid #3f5270;
            border-radius: 0.75rem;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            padding: 0.8rem 1rem;
            resize: vertical;
        }
        .textarea-input:focus {
            background: #1f2f46;
            color: #eaf0fa;
            border-color: #6c8fc0;
            box-shadow: 0 0 0 0.2rem rgba(70, 130, 200, 0.3);
        }
        .label-option {
            font-weight: 500;
            color: #b8cae0;
        }
        .table-container {
            max-height: 340px;
            overflow-y: auto;
        }
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #1d2b3f;
            border-radius: 10px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #4b6085;
            border-radius: 10px;
        }
        .btn-icon {
            font-size: 1.2rem;
            line-height: 1;
        }
        .context-menu {
            background: #2b3a55;
            border: 1px solid #4b6085;
            border-radius: 0.75rem;
            padding: 0.25rem 0;
            min-width: 140px;
        }
        .context-menu .dropdown-item {
            color: #dce6f5;
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
        }
        .context-menu .dropdown-item:hover {
            background: #3a4f70;
            color: white;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container-xl">

    <!-- header -->
    <div class="text-center mb-3">
        <h1 class="display-5 fw-bold" style="color: #b7d0f0;">🔶 Copper Busbar Weight</h1>
        <p class="text-secondary" style="color: #a0b8d0 !important;">calculation · density 8.96 g/cm³ · one line per busbar</p>
    </div>

    <!-- main card -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-cpu me-2"></i>Calculator</span>
            <span class="badge bg-secondary rounded-pill">v2.0</span>
        </div>
        <div class="card-body">

            <!-- options: density + N/E sizing -->
            <div class="row g-3 align-items-end mb-3">
                <div class="col-md-5">
                    <label class="label-option mb-1"><i class="bi bi-droplet me-1"></i>Current density</label>
                    <div class="btn-group" role="group" id="densityGroup">
                        <input type="radio" class="btn-check" name="density" id="d1" value="1" checked>
                        <label class="btn btn-outline-info" for="d1">1 A/mm²</label>
                        <input type="radio" class="btn-check" name="density" id="d15" value="1.5">
                        <label class="btn btn-outline-info" for="d15">1.5 A/mm²</label>
                        <input type="radio" class="btn-check" name="density" id="d2" value="2">
                        <label class="btn btn-outline-info" for="d2">2 A/mm²</label>
                    </div>
                </div>
                <div class="col-md-7">
                    <label class="label-option mb-1"><i class="bi bi-arrow-left-right me-1"></i>Neutral / Earth sizing</label>
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="neutral" id="fn" value="FN" checked>
                        <label class="btn btn-outline-success" for="fn">FN</label>
                        <input type="radio" class="btn-check" name="neutral" id="hn" value="HN">
                        <label class="btn btn-outline-success" for="hn">HN</label>
                        <input type="radio" class="btn-check" name="earth" id="fe" value="FE" checked>
                        <label class="btn btn-outline-danger" for="fe">FE</label>
                        <input type="radio" class="btn-check" name="earth" id="he" value="HE">
                        <label class="btn btn-outline-danger" for="he">HE</label>
                    </div>
                </div>
            </div>

            <!-- input textarea -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="label-option"><i class="bi bi-pencil-square me-1"></i>Busbar input (one per line)</label>
                    <div class="file-input-wrapper">
                        <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-file-earmark-arrow-up me-1"></i>Import .txt</button>
                        <input type="file" id="fileInput" accept=".txt">
                    </div>
                </div>
                <textarea id="inputText" class="form-control textarea-input" rows="5" spellcheck="false">Incoming cb 1600A, 3P, 2M, #1
MAIN BUSBAR 1600A, 3P, 1M, #1
OUTGOING 400A, 3P, 0.8M, #2
N : 1P, 1M, #1
E: 1P, 1M, #1</textarea>
            </div>

            <!-- action buttons -->
            <div class="d-flex flex-wrap gap-2 mb-3">
                <button id="calcBtn" class="btn btn-success"><i class="bi bi-calculator me-1"></i>Calculate</button>
                <button id="clearBtn" class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Clear</button>
                <button id="exportBtn" class="btn btn-outline-warning"><i class="bi bi-file-earmark-excel me-1"></i>Save as Excel</button>
                <span class="ms-auto"><span id="totalWeightDisplay" class="total-weight"><i class="bi bi-weight-scale me-2"></i>0.000 kg</span></span>
            </div>

            <!-- table -->
            <div class="mt-2">
                <div class="table-container">
                    <table class="table table-hover table-bordered border-secondary" id="busbarTable">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Rating</th>
                                <th>Phases</th>
                                <th>Length (m)</th>
                                <th>Cross Section (mm²)</th>
                                <th>Item Qty</th>
                                <th>Total Weight (kg)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- rows inserted by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- hidden context menu (custom) -->
    <div id="contextMenu" class="context-menu dropdown-menu" style="display:none; position:fixed; z-index:1000;">
        <button class="dropdown-item" id="ctxAdd"><i class="bi bi-plus-circle me-1"></i>Add</button>
        <button class="dropdown-item" id="ctxEdit"><i class="bi bi-pencil me-1"></i>Edit</button>
        <button class="dropdown-item" id="ctxRemove"><i class="bi bi-dash-circle me-1"></i>Remove</button>
    </div>
</div>

<!-- modal dialog for add/edit (bootstrap) -->
<div class="modal fade" id="rowModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background:#2b3a55; color:#eef4fc;">
            <div class="modal-header" style="border-bottom:1px solid #3f5270;">
                <h5 class="modal-title" id="modalTitle">Add Busbar</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="rowForm">
                    <div class="mb-3">
                        <label class="form-label">Item</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="fItem" placeholder="e.g. MAIN BUSBAR" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rating (A) <span class="text-secondary">(optional)</span></label>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="fRating" placeholder="1600A or blank">
                    </div>
                    <div class="row g-2">
                        <div class="col-4">
                            <label class="form-label">Phases</label>
                            <input type="number" class="form-control bg-dark text-light border-secondary" id="fPhases" value="3" step="1" min="1">
                        </div>
                        <div class="col-4">
                            <label class="form-label">Length (m)</label>
                            <input type="number" class="form-control bg-dark text-light border-secondary" id="fLength" value="1" step="0.1" min="0.1">
                        </div>
                        <div class="col-4">
                            <label class="form-label">Item Qty</label>
                            <input type="number" class="form-control bg-dark text-light border-secondary" id="fQty" value="1" step="1" min="1">
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="fNeutral">
                            <label class="form-check-label" for="fNeutral">Neutral</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="fEarth">
                            <label class="form-check-label" for="fEarth">Earth</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="border-top:1px solid #3f5270;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="modalSaveBtn">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
    (function(){
        // ----- constants & regex -----
        const COPPER_DENSITY = 0.00896;
        const RATING_RE = /(\d+(?:\.\d+)?)\s*A\b/i;
        const PHASES_RE = /(\d+(?:\.\d+)?)\s*P\b/i;
        const LENGTH_RE = /(\d+(?:\.\d+)?)\s*M\b/i;
        const QTY_RE = /#\s*(\d+)/;

        // ----- state -----
        let rows = []; // array of objects { id, item, rating, phases, length, cross_section, qty, weight }
        let nextId = 1;
        let editingId = null;

        // DOM refs
        const tbody = document.getElementById('tableBody');
        const totalDisplay = document.getElementById('totalWeightDisplay');
        const inputText = document.getElementById('inputText');
        const calcBtn = document.getElementById('calcBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const fileInput = document.getElementById('fileInput');

        // modal elements
        const rowModal = new bootstrap.Modal(document.getElementById('rowModal'));
        const modalTitle = document.getElementById('modalTitle');
        const fItem = document.getElementById('fItem');
        const fRating = document.getElementById('fRating');
        const fPhases = document.getElementById('fPhases');
        const fLength = document.getElementById('fLength');
        const fQty = document.getElementById('fQty');
        const fNeutral = document.getElementById('fNeutral');
        const fEarth = document.getElementById('fEarth');
        const modalSaveBtn = document.getElementById('modalSaveBtn');

        // context menu
        const ctxMenu = document.getElementById('contextMenu');
        const ctxAdd = document.getElementById('ctxAdd');
        const ctxEdit = document.getElementById('ctxEdit');
        const ctxRemove = document.getElementById('ctxRemove');

        // ----- helper: get density & neutral/earth flags -----
        function getDensity() {
            const radio = document.querySelector('input[name="density"]:checked');
            return radio ? parseFloat(radio.value) : 1.0;
        }
        function getNeutralFull() {
            const radio = document.querySelector('input[name="neutral"]:checked');
            return radio ? radio.value === 'FN' : true;
        }
        function getEarthFull() {
            const radio = document.querySelector('input[name="earth"]:checked');
            return radio ? radio.value === 'FE' : true;
        }

        // ----- parsing -----
        function parseLine(line) {
            const raw = line.trim();
            if (!raw) return null;

            const ratingM = RATING_RE.exec(raw);
            const phasesM = PHASES_RE.exec(raw);
            const lengthM = LENGTH_RE.exec(raw);
            const qtyM = QTY_RE.exec(raw);

            const positions = [];
            if (ratingM) positions.push(ratingM.index);
            if (phasesM) positions.push(phasesM.index);
            if (lengthM) positions.push(lengthM.index);
            if (qtyM) positions.push(qtyM.index);

            let name = raw;
            if (positions.length) {
                const minPos = Math.min(...positions);
                name = raw.substring(0, minPos);
            }
            name = name.replace(/^[\s,;:-]+|[\s,;:-]+$/g, '');
            if (!name) name = 'ITEM';

            const rating = ratingM ? parseFloat(ratingM[1]) : null;
            const phases = phasesM ? parseInt(phasesM[1], 10) : 1;
            const length = lengthM ? parseFloat(lengthM[1]) : 1.0;
            const qty = qtyM ? parseInt(qtyM[1], 10) : 1;

            const upper = name.toUpperCase();
            const isNeutral = upper === 'N' || upper === 'NEUTRAL' || upper.includes('NEUTRAL');
            const isEarth = upper === 'E' || upper === 'EARTH' || upper === 'GND' || upper === 'GROUND' || upper.includes('EARTH') || upper.includes('GROUND');

            return { item: name, rating, phases, length, qty, isNeutral, isEarth };
        }

        function computeRows(parsedRows, density, neutralFull, earthFull) {
            const ratedCs = parsedRows.filter(r => r.rating !== null).map(r => r.rating / density);
            const mainRefCs = ratedCs.length ? Math.max(...ratedCs) : 0.0;

            return parsedRows.map(r => {
                let cs, ratingDisplay;
                if (r.rating !== null) {
                    cs = r.rating / density;
                    ratingDisplay = `${r.rating}A`;
                } else {
                    let factor = 1.0;
                    if (r.isNeutral) factor = neutralFull ? 1.0 : 0.5;
                    else if (r.isEarth) factor = earthFull ? 1.0 : 0.5;
                    cs = mainRefCs * factor;
                    ratingDisplay = '-';
                }
                const bars = r.phases * r.qty;
                const weightPerBar = cs * r.length * COPPER_DENSITY;
                const totalWeight = weightPerBar * bars;
                return {
                    item: r.item,
                    rating: ratingDisplay,
                    phases: r.phases,
                    length: r.length,
                    cross_section: Math.round(cs * 100) / 100,
                    qty: r.qty,
                    weight: Math.round(totalWeight * 1000) / 1000,
                };
            });
        }

        // ----- table rendering -----
        function renderTable() {
            tbody.innerHTML = '';
            let total = 0;
            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.dataset.id = row.id;
                tr.innerHTML = `
                    <td>${row.item}</td>
                    <td>${row.rating}</td>
                    <td>${row.phases}</td>
                    <td>${row.length}</td>
                    <td>${row.cross_section}</td>
                    <td>${row.qty}</td>
                    <td>${row.weight.toFixed(3)}</td>
                `;
                tbody.appendChild(tr);
                total += row.weight;
            });
            totalDisplay.textContent = `${total.toFixed(3)} kg`;
        }

        // ----- add/update/delete rows -----
        function addRowData(data) {
            const row = { id: nextId++, ...data };
            rows.push(row);
            renderTable();
            return row;
        }

        function updateRowData(id, data) {
            const idx = rows.findIndex(r => r.id === id);
            if (idx === -1) return false;
            rows[idx] = { id, ...data };
            renderTable();
            return true;
        }

        function deleteRowData(id) {
            rows = rows.filter(r => r.id !== id);
            renderTable();
        }

        function deleteAllRows() {
            rows = [];
            renderTable();
        }

        // ----- calculate from text (clears output first) -----
        function calculateFromText() {
            // clear output table before recalculating
            deleteAllRows();

            const text = inputText.value;
            const lines = text.split('\n');
            const parsed = lines.map(ln => parseLine(ln)).filter(p => p !== null);
            if (!parsed.length) {
                alert('Please enter at least one valid busbar line.');
                return;
            }
            const density = getDensity();
            const neutralFull = getNeutralFull();
            const earthFull = getEarthFull();
            const results = computeRows(parsed, density, neutralFull, earthFull);
            results.forEach(r => addRowData(r));
        }

        // ----- export to excel -----
        function exportExcel() {
            if (!rows.length) {
                alert('No data to export.');
                return;
            }
            const data = rows.map(r => ({
                'Item': r.item,
                'Rating': r.rating,
                'Phases': r.phases,
                'Length (m)': r.length,
                'Cross Section (mm²)': r.cross_section,
                'Item Qty': r.qty,
                'Total Weight (kg)': r.weight
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Busbar Weight');
            XLSX.writeFile(wb, 'busbar_weight_calculation.xlsx');
        }

        // ----- file import -----
        function handleFileImport(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                inputText.value = e.target.result;
                // optional: auto-calculate after import?
                // we choose not to auto-calc, user clicks calculate
            };
            reader.readAsText(file);
            fileInput.value = ''; // reset so same file can be re-imported
        }

        // ----- modal helpers -----
        function openModal(title, data) {
            modalTitle.textContent = title;
            if (data) {
                fItem.value = data.item || '';
                fRating.value = (data.rating && data.rating !== '-') ? data.rating : '';
                fPhases.value = data.phases || 3;
                fLength.value = data.length || 1;
                fQty.value = data.qty || 1;
                const up = (data.item || '').toUpperCase();
                fNeutral.checked = up === 'N' || up === 'NEUTRAL' || up.includes('NEUTRAL');
                fEarth.checked = up === 'E' || up === 'EARTH' || up === 'GND' || up === 'GROUND' || up.includes('EARTH') || up.includes('GROUND');
                editingId = data.id || null;
            } else {
                fItem.value = '';
                fRating.value = '';
                fPhases.value = 3;
                fLength.value = 1;
                fQty.value = 1;
                fNeutral.checked = false;
                fEarth.checked = false;
                editingId = null;
            }
            rowModal.show();
        }

        function saveFromModal() {
            const item = fItem.value.trim();
            if (!item) { alert('Item name is required.'); return; }
            let rating = null;
            const ratingRaw = fRating.value.trim();
            if (ratingRaw) {
                const num = parseFloat(ratingRaw.replace(/[^0-9.]/g, ''));
                if (!isNaN(num)) rating = num;
            }
            const phases = parseInt(fPhases.value, 10) || 1;
            const length = parseFloat(fLength.value) || 1;
            const qty = parseInt(fQty.value, 10) || 1;
            const isNeutral = fNeutral.checked;
            const isEarth = fEarth.checked;

            const density = getDensity();
            const neutralFull = getNeutralFull();
            const earthFull = getEarthFull();
            const parsed = [{ item, rating, phases, length, qty, isNeutral, isEarth }];
            const results = computeRows(parsed, density, neutralFull, earthFull);
            const data = results[0];

            if (editingId !== null) {
                updateRowData(editingId, data);
            } else {
                addRowData(data);
            }
            rowModal.hide();
        }

        // ----- context menu logic -----
        let selectedId = null;

        function getSelectedRowId() {
            const sel = document.querySelector('tbody tr.table-active');
            if (sel) return parseInt(sel.dataset.id, 10);
            return null;
        }

        function highlightRow(id) {
            document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('table-active'));
            if (id !== null) {
                const tr = document.querySelector(`tbody tr[data-id="${id}"]`);
                if (tr) tr.classList.add('table-active');
            }
        }

        function showContextMenu(e) {
            e.preventDefault();
            const tr = e.target.closest('tr');
            if (tr) {
                const id = parseInt(tr.dataset.id, 10);
                selectedId = id;
                highlightRow(id);
            } else {
                selectedId = null;
                highlightRow(null);
            }
            ctxMenu.style.display = 'block';
            ctxMenu.style.left = e.clientX + 'px';
            ctxMenu.style.top = e.clientY + 'px';
        }

        function hideContextMenu() {
            ctxMenu.style.display = 'none';
        }

        // ----- event binding -----
        // calculate
        calcBtn.addEventListener('click', calculateFromText);

        // clear (also clears input text)
        clearBtn.addEventListener('click', function() {
            if (rows.length && !confirm('Remove all rows from the table and clear input?')) return;
            deleteAllRows();
            inputText.value = '';
        });

        // export
        exportBtn.addEventListener('click', exportExcel);

        // file import
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                handleFileImport(this.files[0]);
            }
        });

        // context menu on table
        document.getElementById('busbarTable').addEventListener('contextmenu', showContextMenu);
        document.addEventListener('click', function(e) {
            if (!ctxMenu.contains(e.target)) hideContextMenu();
        });

        // context menu actions
        ctxAdd.addEventListener('click', function() {
            hideContextMenu();
            openModal('Add Busbar Row', null);
        });

        ctxEdit.addEventListener('click', function() {
            hideContextMenu();
            const id = getSelectedRowId();
            if (id === null) { alert('Select a row first.'); return; }
            const row = rows.find(r => r.id === id);
            if (!row) return;
            openModal('Edit Busbar Row', row);
        });

        ctxRemove.addEventListener('click', function() {
            hideContextMenu();
            const id = getSelectedRowId();
            if (id === null) { alert('Select a row first.'); return; }
            if (!confirm('Remove selected row?')) return;
            deleteRowData(id);
        });

        // modal save
        modalSaveBtn.addEventListener('click', saveFromModal);
        document.getElementById('rowForm').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); saveFromModal(); }
        });

        // double-click to edit
        tbody.addEventListener('dblclick', function(e) {
            const tr = e.target.closest('tr');
            if (!tr) return;
            const id = parseInt(tr.dataset.id, 10);
            const row = rows.find(r => r.id === id);
            if (row) openModal('Edit Busbar Row', row);
        });

        // initial demo rows (pre-filled from text)
        setTimeout(() => {
            calculateFromText();
        }, 100);

        // ensure total update on load
        window.addEventListener('load', function() {
            renderTable();
        });
    })();
</script>
</body>
</html>
